name: 🧩 框架兼容问题
description: 已支持的六个框架下出现安装失败、启动报错、命令不响应、面板打不开等问题
title: "[兼容] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        本插件同源适配六框架，已支持框架下的故障请务必填写完整的环境信息。
        如需申请适配**全新的框架**，请改用「🧱 新框架适配申请」模板。

  - type: dropdown
    id: framework
    attributes:
      label: 目标框架
      options:
        - Miao-Yunzai
        - TRSS-Yunzai
        - MangoCat-Yunzai
        - JiuLi（玖璃）
        - Karin
        - Yunzai-NG
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 克隆 / 安装依赖
        - 启动加载插件
        - 命令执行
        - 定时任务 / 推送
        - 可视化面板（Guoba / Karin-Web / Yunzai-NG）
        - 其他
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: 框架版本 / 提交
      placeholder: 例如 Karin v1.x、commit 短哈希或发布日期
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 1.2.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      placeholder: 例如 v22.15.0
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 问题描述与日志
      description: 请粘贴完整报错堆栈；面板类问题请附浏览器控制台报错
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认 Node.js ≥ 22.15，且依赖安装无报错
          required: true
        - label: 我已搜索过现有 Issue，确认不是重复反馈
          required: true
