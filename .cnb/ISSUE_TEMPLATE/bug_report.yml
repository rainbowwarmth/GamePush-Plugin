# ⚠️ 本文件是 .github/ISSUE_TEMPLATE/bug_report.yml 的镜像副本，供 CNB（读取 .cnb/ISSUE_TEMPLATE）使用。
# 修改模板时请同步更新两处，避免各平台内容不一致。
name: 🐛 Bug 反馈
description: 插件报错、推送异常、渲染失败等问题的反馈
title: 【Bug】
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索[已有 Issue](https://gitcode.com/rainbowwarmth/GamePush-Plugin/issues)，避免重复。

  - type: dropdown
    id: framework
    attributes:
      label: 使用的框架
      description: 请选择你正在运行的机器人框架
      options:
        - Miao-Yunzai
        - TRSS-Yunzai
        - MangoCat-Yunzai
        - JiuLi（玖璃）
        - Karin
        - Yunzai-NG
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: package.json 中的 version，或「GamePush版本」命令的输出
      placeholder: 例如 1.2.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      description: 执行 node -v 的结果（插件要求 22.15 以上）
      placeholder: 例如 v22.15.0
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: 涉及的游戏
      description: 可多选
      multiple: true
      options:
        - 原神
        - 崩坏：星穹铁道
        - 绝区零
        - 崩坏 3
        - 鸣潮
        - 明日方舟：终末地
        - 与具体游戏无关
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行命令 ...
        2. 出现 ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错日志 / 截图
      description: 请粘贴完整报错堆栈（不要只截一半），敏感信息（Token、群号）请打码
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复反馈
          required: true
        - label: 我已阅读 README 的安装与配置说明
          required: true
        - label: 我使用的是最新版插件（main 分支）
          required: false
